name: e2e ios

# Runs the flows in tools/e2e that need no real model on an iOS simulator
# against a local Convex backend built from the same commit. Not a required check yet: it
# reports, and a failure does not block a merge. Once it has a clean record it
# moves into ci.yml, so deploys wait on it too.
#
# No secrets: the backend is a throwaway local deployment (CONVEX_AGENT_MODE
# anonymous), so a fork's pull request runs it the same way. The backend's
# model is the deterministic fake in convex/model/fakeAi.ts, which classifies
# a note from its own words, so save-note runs here, and serves the fixture
# pages in the same file, so save-link-fixture saves a link with no network
# read. It also suggests the saves that share a word with a new space's name,
# so space-suggestions sees a seeded save suggested. Two flows are left out because the fake cannot stand in for them:
# save-link and save-image judge the screen with a real model.

# On a pull request it runs only once the PR carries the `run-e2e` label:
# adding the label starts a run, and while it stays on, every push re-runs
# it. Each run takes about 25 minutes of two macOS runners, and running it on
# every push of every PR left five queued against each other (2026-10-21).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/native/**"
      - "tools/e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/e2e-ios.yml"
  # A push to main refreshes the cached build that pull requests restore.
  push:
    branches: [main]
    paths:
      - "apps/native/**"
      - "tools/e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/e2e-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on its old commit. On main
# every commit keeps its own run, in a group of its own: merges landing close
# together used to cancel each other (four on 2026-10-15), so main never built
# the record of clean runs this check needs before it can be required.
# Adding any other label also starts this workflow (its jobs then skip); that
# run takes a group of its own, so it never cancels a real run.
concurrency:
  group: e2e-ios-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-e2e') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_TELEMETRY_DISABLED: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  ios:
    name: e2e ios (${{ matrix.shard.name }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-e2e') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: macos-26
    timeout-minutes: 90
    # The flows split over two runners, each with its own simulator and
    # backend, balanced on the 2026-10-21 timings: 7 to 10 minutes of flows
    # each once setup is done. One shard failing does not stop the other.
    # A shard runs its files in name order. Onboarding stays behind
    # create-space, as on a single runner: as the first flow on a fresh
    # simulator it lost the driver twice ("Daemon request timed out").
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: a
            tests: >-
              tests/create-space.e2e.ts
              tests/onboarding.e2e.ts
              tests/paywall.e2e.ts
          - name: b
            tests: >-
              tests/save-link-fixture.e2e.ts
              tests/save-note.e2e.ts
              tests/search.e2e.ts
              tests/search-no-results.e2e.ts
              tests/space-suggestions.e2e.ts
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      # e2e needs Node 22.12 or later, above the root package's minimum.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The development build only changes when its native fingerprint does,
      # so the key is that fingerprint plus the Xcode that compiled it, plus
      # how it was signed.
      - name: Native fingerprint
        id: fingerprint
        working-directory: apps/native
        run: |
          hash=$(node "$(dirname "$(node -p 'require.resolve("expo-updates/package.json")')")/bin/cli.js" \
            fingerprint:generate --platform ios | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')
          xcode=$(xcodebuild -version | tr -d ' \n')
          echo "key=e2e-ios-dev-adhoc-$hash-$xcode" >> "$GITHUB_OUTPUT"
          # The XCTest runner depends on agent-device and Xcode only, so an
          # unrelated lockfile change does not cost a 2.5 minute rebuild.
          device=$(node -p 'require("../../node_modules/agent-device/package.json").version')
          echo "runner-key=agent-device-$device-$xcode" >> "$GITHUB_OUTPUT"

      # Restore and save are split so a build is kept even when a flow fails
      # later in the job; actions/cache saves only after a successful job.
      - name: Restore the development build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/native/build/e2e/ShelvrDev.app
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Build the development build
        id: build
        if: steps.build-cache.outputs.cache-hit != 'true'
        working-directory: apps/native
        run: |
          npx expo prebuild -p ios --clean
          mkdir -p build/e2e
          # Signed ad hoc, not unsigned: an unsigned app carries no
          # entitlements, and the simulator then refuses its Keychain reads
          # ("A required entitlement isn't present"), which expo-secure-store
          # and so sign-in depend on. Ad hoc needs no team or profile.
          xcodebuild -workspace ios/ShelvrDev.xcworkspace -scheme ShelvrDev \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            > build/xcodebuild.log 2>&1 || { tail -200 build/xcodebuild.log; exit 1; }
          cp -R build/derived/Build/Products/Debug-iphonesimulator/ShelvrDev.app build/e2e/

      - name: Save the development build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/native/build/e2e/ShelvrDev.app
          key: ${{ steps.fingerprint.outputs.key }}

      # agent-device compiles its XCUITest runner on first use.
      - name: Restore the agent-device runner
        id: runner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.agent-device
          key: ${{ steps.fingerprint.outputs.runner-key }}

      # The picker taps in save-image are measured on an iPhone 17, and the
      # other flows run on any iPhone; the runtime is the newest the image has.
      - name: Boot a simulator and install the build
        run: |
          runtime=$(xcrun simctl list runtimes available -j | node -p '
            JSON.parse(require("fs").readFileSync(0)).runtimes
              .filter((r) => r.platform === "iOS").at(-1).identifier')
          echo "runtime $runtime"
          udid=$(xcrun simctl create e2e "iPhone 17" "$runtime")
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" apps/native/build/e2e/ShelvrDev.app
          echo "E2E_DEVICE=$udid" >> "$GITHUB_ENV"

      # A cold runner build can outlast the budget e2e gives the engine to
      # start (seen: "boot failed: Daemon request timed out"), so it is built
      # here with a budget of its own. The daemon is stopped afterwards so it
      # does not hold the runner the run's own daemon needs. --json prints
      # where the time went (timing.additiveParts: build vs connect): this
      # step takes 1 to 5 minutes even when its cache hits.
      - name: Prepare the XCTest runner
        id: prepare-runner
        run: |
          node node_modules/agent-device/bin/agent-device.mjs prepare ios-runner \
            --platform ios --udid "$E2E_DEVICE" --timeout 900000 --json
          tools/e2e/stop-agent-device.sh

      - name: Save the agent-device runner
        if: ${{ !cancelled() && steps.prepare-runner.outcome == 'success' && steps.runner-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.agent-device
          key: ${{ steps.fingerprint.outputs.runner-key }}

      # A throwaway deployment on this machine. The first `convex dev --once`
      # creates it and writes its URLs to .env.local, then stops at the push,
      # which needs the required model key; the env is set after that. The key
      # is a placeholder, which together with E2E_FAKE_AI, dev sign-in and the
      # loopback URL is what lets the fake model answer. A call it has no
      # answer for fails.
      #
      # The runner is several times slower than Convex's servers, and its
      # queries have run past the 1 s production limit (`legalConsent:get`,
      # the first sign-in), failing a flow on a timeout no user would see.
      # The local backend reads its limits from the environment the CLI
      # passes it, so this one allows 10 s.
      - name: Start a local Convex backend
        working-directory: apps/native
        env:
          CONVEX_AGENT_MODE: anonymous
          DATABASE_UDF_USER_TIMEOUT_SECONDS: "10"
        run: |
          keys=$(node --input-type=module -e '
            import { exportJWK, exportPKCS8, generateKeyPair } from "jose";
            const { privateKey, publicKey } = await generateKeyPair("RS256", { extractable: true });
            const jwk = await exportJWK(publicKey);
            console.log(JSON.stringify({
              privateKey: (await exportPKCS8(privateKey)).trimEnd().replace(/\n/g, " "),
              jwks: JSON.stringify({ keys: [{ use: "sig", ...jwk }] }),
            }));')
          npx convex dev --once --typecheck disable --codegen disable || true
          test -f .env.local
          npx convex env set GOOGLE_GENERATIVE_AI_API_KEY ci-no-model
          npx convex env set AUTH_ENABLE_ANONYMOUS true
          npx convex env set E2E_FAKE_AI local-v1
          npx convex env set JWT_PRIVATE_KEY -- "$(node -p 'JSON.parse(process.argv[1]).privateKey' "$keys")"
          npx convex env set JWKS -- "$(node -p 'JSON.parse(process.argv[1]).jwks' "$keys")"
          nohup npx convex dev --typecheck disable --codegen disable --tail-logs always \
            > "$RUNNER_TEMP/convex.log" 2>&1 &
          for _ in $(seq 1 120); do
            grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log" && break
            sleep 2
          done
          grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log" || { cat "$RUNNER_TEMP/convex.log"; exit 1; }
          # The first anonymous sign-in on a cold backend has run past the
          # 1 s function limit and failed the first flow's setup. Sign in
          # once here, as a throwaway user, so the flows meet a warm backend.
          # The first attempt may time out; the second must succeed.
          npx convex run auth:signIn '{"provider":"anonymous","params":{}}' > /dev/null ||
            npx convex run auth:signIn '{"provider":"anonymous","params":{}}' > /dev/null
          # The push wrote the local URLs into .env.local, which Metro reads.
          # The run's Metro gets no other environment from this job, so the
          # dev sign-in flag and the Development Test Store key (pinned in
          # app.config.js) go into the same file.
          {
            echo "EXPO_PUBLIC_AUTH_ENABLE_ANONYMOUS=true"
            echo "EXPO_PUBLIC_REVENUECAT_TEST_KEY=test_VOYicTvOGPXCBFMVdHzyxRndiRi"
          } >> .env.local
          cat .env.local

      # The app opens Metro's bundle URL directly (tests/launch.ts), and the
      # dev launcher gives it 10 s. Build the bundle once beforehand, so the
      # run's Metro starts from a warm transform cache, and log how long a
      # cold build takes on this runner.
      - name: Warm the bundle
        working-directory: apps/native
        run: |
          nohup pnpm exec expo start --dev-client --port 8091 > "$RUNNER_TEMP/metro-warm.log" 2>&1 &
          for _ in $(seq 1 90); do curl -s localhost:8091/status | grep -q running && break; sleep 2; done
          curl -s localhost:8091/status | grep -q running || { cat "$RUNNER_TEMP/metro-warm.log"; exit 1; }
          url=$(node --input-type=module -e '
            const { LAUNCH_ARGUMENTS } = await import(process.argv[1]);
            console.log(LAUNCH_ARGUMENTS[LAUNCH_ARGUMENTS.indexOf("--initialUrl") + 1]);
          ' "$GITHUB_WORKSPACE/tools/e2e/tests/launch.ts")
          for pass in cold warm; do
            curl -sS --fail -m 600 -o /dev/null -w "$pass bundle %{http_code} %{size_download} bytes %{time_total}s\n" "$url"
          done
          pkill -f -- "--port 8091" || true
          for _ in $(seq 1 30); do curl -s localhost:8091/status > /dev/null || exit 0; sleep 1; done
          cat "$RUNNER_TEMP/metro-warm.log"
          echo "::error::Metro on 8091 did not stop; the run could not start its own"
          exit 1

      # A failure here is decided by the next step, which can rerun the flows.
      - name: Run the flows
        id: flows
        continue-on-error: true
        working-directory: tools/e2e
        # Tells the flows that need the fake (save-link-fixture,
        # space-suggestions) that the backend runs it. E2E_FIXTURE_RESET has
        # the seeded flows reset their data with `convex run` against this
        # local backend instead of through Settings (startOnSeededHome), which
        # cost each flow about 50 seconds of taps and a relaunch.
        env:
          E2E_FAKE_AI: local-v1
          E2E_FIXTURE_RESET: backend
          CONVEX_AGENT_MODE: anonymous
        run: pnpm exec e2e run ${{ matrix.shard.tests }} --reporter list,junit

      # The test tool's daemon can wedge for good: every read then answers
      # "Daemon request timed out" until the test gives up (main after #431,
      # #446's first run), and a test retry meets the same daemon. When a
      # failure reads like that, stop the daemon, reboot the simulator, which
      # ends its XCTest runner, and run the tests that did not pass once more.
      # A real failure should fail again; one the tool caused gets a fresh daemon.
      - name: Rerun flows the test tool dropped
        id: rerun
        if: ${{ steps.flows.outcome == 'failure' }}
        working-directory: tools/e2e
        env:
          E2E_FAKE_AI: local-v1
          E2E_FIXTURE_RESET: backend
          CONVEX_AGENT_MODE: anonymous
        run: |
          test -f .e2e/report.json || exit 1
          # Only a failure --last-failed reruns counts: a test's final
          # attempt, or a beforeAll/afterAll hook, not a flaky test's
          # earlier attempt.
          node -e '
            const run = JSON.parse(require("fs").readFileSync(".e2e/report.json", "utf8")).run;
            const wedged = /Daemon request timed out|test tool stopped answering|overran its watchdog|runner is wedged|ENGINE_FAILURE|LAUNCH_TIMEOUT|xcrun timed out/;
            const failed = run.results
              .filter((r) => ["failed", "timed-out", "interrupted"].includes(r.status))
              .map((r) => r.attempts?.at(-1)?.error ?? r.error);
            const hooks = run.errors.filter((e) => e.phase === "beforeAll" || e.phase === "afterAll");
            process.exit([...failed, ...hooks].some((e) => wedged.test(JSON.stringify(e ?? ""))) ? 0 : 1);
          ' || exit 1
          echo "::warning title=Test tool wedged::restarting the daemon and simulator, then rerunning the tests that did not pass"
          # The rerun writes its own report; keep the first run's for the artifact.
          first="$RUNNER_TEMP/first-run"
          mkdir -p "$first"
          cp .e2e/report.json "$first/"
          cp ~/.agent-device/daemon.log "$first/" 2>/dev/null || true
          ./stop-agent-device.sh
          xcrun simctl shutdown "$E2E_DEVICE" || true
          xcrun simctl bootstatus "$E2E_DEVICE" -b
          status=0
          pnpm exec e2e run ${{ matrix.shard.tests }} --last-failed --reporter list,junit || status=$?
          mkdir -p .e2e/first-run && cp "$first"/* .e2e/first-run/
          exit $status

      # tapUntilVisible taps again when a tap was lost. The run still passes
      # then, so a recovered tap is surfaced here as a warning on the pull
      # request instead of disappearing into the report.
      - name: Flag recovered taps
        if: ${{ !cancelled() }}
        working-directory: tools/e2e
        run: |
          node -e '
            if (!require("fs").existsSync(".e2e/report.json")) process.exit(0);
            const report = JSON.parse(require("fs").readFileSync(".e2e/report.json", "utf8"));
            const watched = /name: "(Profile|Add|New space|Spaces|Search)"/;
            const walk = (node) => {
              if (Array.isArray(node)) return node.forEach(walk);
              if (!node || typeof node !== "object") return;
              if (Array.isArray(node.steps)) {
                const taps = {};
                for (const step of node.steps)
                  if (step.api === "locator.tap" && watched.test(step.label ?? ""))
                    taps[step.label] = (taps[step.label] ?? 0) + 1;
                for (const [label, count] of Object.entries(taps))
                  if (count > 1) console.log(`::warning title=Recovered tap::${count} taps on ${label} in one test; a tap was lost`);
              }
              Object.values(node).forEach(walk);
            };
            walk(report);
          '

      # The screen each failed test ended on, and Metro's last lines, in the
      # job log itself, so a failure reads without downloading the artifact.
      - name: Print what failed tests saw
        if: ${{ failure() }}
        working-directory: tools/e2e
        run: |
          find .e2e/artifacts -path '*/failure/screen.txt' 2>/dev/null | while read -r f; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          echo "::group::metro.log (last 200 lines)"; tail -200 .e2e/metro.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::app log (dev launcher and network errors)"
          xcrun simctl spawn "$E2E_DEVICE" log show --last 60m --style compact \
            --predicate 'process == "ShelvrDev"' 2>/dev/null \
            | grep -iE "devlauncher|manifest|NSURLError|bundle|error" | tail -150 || true
          echo "::endgroup::"

      # The backend's log, and the test tool's: its daemon's lifecycle log and
      # the XCTest runner's, which say why a read timed out.
      - name: Copy the backend and test tool logs
        if: ${{ !cancelled() }}
        run: |
          cp "$RUNNER_TEMP/convex.log" tools/e2e/.e2e/ 2>/dev/null || true
          cp ~/.agent-device/daemon.log tools/e2e/.e2e/ 2>/dev/null || true
          # Each session keeps its runner's log under the daemon's state; the
          # path, flattened, keeps sessions apart.
          mkdir -p tools/e2e/.e2e/runner-logs
          find "$HOME/.agent-device" "${TMPDIR:-/tmp}/agent-device" -name '*.xcresult' -prune -o -name '*.log' ! -name daemon.log -print 2>/dev/null |
            while read -r log; do cp "$log" "tools/e2e/.e2e/runner-logs/$(echo "${log#"$HOME"/}" | tr '/' '_')"; done || true

      - name: Upload the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ios-${{ matrix.shard.name }}
          path: tools/e2e/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # One stable check named `e2e ios` over both shards, for when the check
  # becomes required. It skips with them on a pull request without the label.
  # A run that another label started reports under a name of its own, so its
  # skip never stands in for this commit's real result.
  result:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'run-e2e' && 'e2e ios (label)' || 'e2e ios' }}
    needs: ios
    if: ${{ !cancelled() && needs.ios.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both shards passed
        run: test "${{ needs.ios.result }}" = success
