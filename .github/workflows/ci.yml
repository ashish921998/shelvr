name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger so a run can be requested even when the pull_request
  # event is not delivered to Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # CI runs the exact minimum Node version the root package.json `engines`
      # field supports, so a newer local runtime cannot mask a regression there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Dead code
        run: pnpm run knip

      - name: Security audit
        run: pnpm run audit

      - name: Version drift
        run: pnpm run syncpack:lint

      - name: Test coverage
        run: pnpm run coverage
