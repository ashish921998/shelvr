name: Release

on:
  # One-click store builds and production OTA updates, replacing local
  # `eas build` / `eas update` invocations. Every run records its inputs.
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "build" runs eas build (optionally with submit); "ota" publishes an
          EAS Update to the production channel without a store build.
        type: choice
        options: [build, ota]
        default: build
      platform:
        description: Platform to build (ignored for ota)
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: eas.json build profile (ignored for ota)
        type: choice
        options: [production, internal-test]
        default: production
      submit:
        description: >-
          Submit to the stores after the build. Requires store credentials on
          EAS servers: an App Store Connect API key for iOS, and for Android
          the EAS_GOOGLE_SERVICE_ACCOUNT_KEY secret (base64 of the Play API
          JSON key). Leave off until those are configured.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize backend deploys and client publication with Deploy.
  group: ${{ github.ref != 'refs/heads/main' && github.run_id || 'deploy' }}
  cancel-in-progress: false

jobs:
  reject-non-main:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject dispatch from a non-main ref
        run: |
          echo '::error::Release must be dispatched from main. Select main in the Run workflow branch selector.'
          exit 1

  release:
    name: ${{ inputs.mode == 'ota' && 'Publish production OTA' || 'Build' }}
    # Releases only ever ship from main. The production environment's
    # required reviewer is the approval gate before anything reaches users.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify CI for the selected commit
        uses: actions/github-script@v7
        with:
          script: |
            await require('./tools/verify-ci.cjs')({ github, context, core });

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Create a robot access token at expo.dev (Account settings > Access tokens) and add it as a repository secret."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      # Validate the values available to OTA, including both store SDK keys.
      - name: Verify the EAS production environment
        if: inputs.mode == 'ota'
        working-directory: apps/native
        env:
          APP_VARIANT: production
        run: |
          ota_env="$(mktemp)"
          trap 'rm -f "$ota_env"' EXIT
          eas env:pull production --path "$ota_env" --non-interactive > /dev/null
          node ../../tools/verify-ota-env.mjs "$ota_env"

      # Android submission needs the Play API key on disk at the path eas.json
      # declares. It arrives as a base64 repo secret so the JSON never lands in
      # the checkout; without it the CLI would hit a non-interactive prompt and
      # die after the builds are already queued and paid for.
      - name: Write the Play service account key
        if: inputs.mode == 'build' && inputs.submit && inputs.platform != 'ios'
        env:
          EAS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.EAS_GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$EAS_GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "EAS_GOOGLE_SERVICE_ACCOUNT_KEY is not set. Base64-encode the Google Play API JSON key (Play Console > Users and permissions > API access) and add it as a repository secret, or run with submit off."
            exit 1
          fi
          echo "$EAS_GOOGLE_SERVICE_ACCOUNT_KEY" | base64 -d > apps/native/google-service-account-key.json

      - name: Verify the iOS submission key on EAS
        if: inputs.mode == 'build' && inputs.submit && inputs.platform != 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node tools/verify-ios-submit.mjs

      # Ship the matching backend before either a store build or an OTA.
      # The shared concurrency group prevents Deploy from interleaving.
      - name: Deploy the selected commit to Convex production
        working-directory: apps/native
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo '::error::CONVEX_DEPLOY_KEY is required to deploy the backend before releasing the client.'
            exit 1
          fi
          pnpm exec convex deploy

      - name: Build with EAS
        if: inputs.mode == 'build'
        working-directory: apps/native
        run: >-
          eas build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --wait
          ${{ inputs.submit && (inputs.profile == 'internal-test' && '--auto-submit-with-profile production' || '--auto-submit') || '' }}

      # The update carries this tree's fingerprint and a binary only accepts
      # one that matches its own, so a publish that moves it reaches nobody and
      # still reports success. env:exec runs the check under the same
      # environment the publish resolves, which matters: without it
      # GOOGLE_MAPS_API_KEY is absent and the Android hash is not the one the
      # update gets stamped with. APP_VARIANT is set here for the same reason.
      - name: Verify the update can reach the released build
        if: inputs.mode == 'ota'
        working-directory: apps/native
        env:
          APP_VARIANT: production
        run: >-
          eas env:exec production
          "node ../../tools/verify-ota-compatibility.mjs
          --profile production --platform all"

      - name: Publish production OTA
        if: inputs.mode == 'ota'
        working-directory: apps/native
        env:
          # Pin the variant so app.config.js resolves the production bundle
          # identity — without it the update is built as the development
          # variant, never matches a store build's fingerprint, and the
          # publish silently reaches nobody.
          APP_VARIANT: production
        run: eas update --channel production --environment production --message "main $(git rev-parse --short HEAD)" --non-interactive
