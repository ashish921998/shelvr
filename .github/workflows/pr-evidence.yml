name: PR evidence

# A pull request says how it was verified, and a UI change shows a screenshot.
# This lives apart from ci.yml because it has to re-run when the description is
# edited, and an edit should not re-run the whole test suite.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: verification evidence
    # Dependency bots open pull requests nobody ran by hand; CI is their evidence.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      # The body goes through the environment, never into the script text, so
      # nothing a description says can run as shell.
      - name: Check the description for verification evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/verify-pr-evidence.mjs "$BASE_SHA"
