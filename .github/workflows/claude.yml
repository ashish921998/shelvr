name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.origin.outputs.allowed }}
    steps:
      - name: Check the pull request origin before supplying agent secrets
        id: origin
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let allowed = context.eventName === 'issues' ||
              (context.eventName === 'issue_comment' && Boolean(context.payload.issue) &&
                !context.payload.issue.pull_request);
            const pullNumber = context.payload.pull_request?.number ??
              (context.payload.issue?.pull_request ? context.payload.issue.number : undefined);
            if (pullNumber !== undefined) {
              const { data } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullNumber,
              });
              allowed = data.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            }
            core.setOutput('allowed', String(allowed));

  claude:
    needs: authorize
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (github.actor == github.repository_owner ||
       ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
       (github.event_name == 'issues' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'pull_request' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # Required for the existing GitHub App authentication flow.
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Clear reserved review tooling path
        run: rm -rf .secure-review-tooling
      - name: Checkout immutable trusted review tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: 754266328766453337830533266339f30a368749
          path: .secure-review-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/secure-review
            tools/harden-review-action.mjs
            tools/main-module.mjs
      - name: Prepare pinned claude dependencies
        uses: ./.secure-review-tooling/.github/actions/secure-review
        with:
          provider: claude
      - name: Run Claude Code
        id: claude
        uses: ./.secure-review-tooling/runtime/claude
        env:
          DISABLE_AUTOUPDATER: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
