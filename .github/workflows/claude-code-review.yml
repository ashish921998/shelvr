name: Claude Code Review

on:
  pull_request:
    # Not on every push: one review when a PR is opened, reopened or marked
    # ready. Codex reviews the final head on the Mac. For another CI pass on
    # a later push, mark the PR draft and then ready again: a plain re-run
    # replays the old event and reviews the old commit.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Bot PRs (Dependabot) get no CLAUDE_CODE_OAUTH_TOKEN and the action
    # refuses non-human actors, so the job would only fail. Skip it for them.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to publish inline review comments.
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Clear reserved review tooling path
        run: rm -rf .secure-review-tooling
      - name: Checkout immutable trusted review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: 754266328766453337830533266339f30a368749
          path: .secure-review-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/secure-review
            tools/harden-review-action.mjs
            tools/main-module.mjs
      - name: Prepare pinned claude dependencies
        uses: ./.secure-review-tooling/.github/actions/secure-review
        with:
          provider: claude
      - name: Download pinned Bun through the release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release download bun-v1.3.14 --repo oven-sh/bun --pattern bun-linux-x64.zip \
              --output "$RUNNER_TEMP/review-bun.zip" --clobber &&
              echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $RUNNER_TEMP/review-bun.zip" | sha256sum --check --status; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
          done
          unzip -q "$RUNNER_TEMP/review-bun.zip" -d "$RUNNER_TEMP/review-bun"
      - name: Run Claude Code Review
        id: claude-review
        uses: ./.secure-review-tooling/runtime/claude
        env:
          DISABLE_AUTOUPDATER: "1"
        with:
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ runner.temp }}/review-bun/bun-linux-x64/bun
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} for actionable correctness and security regressions. Read REVIEW.md first and follow it. Inspect the diff and relevant source. Report only verified issues with precise file and line references using inline comments."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
