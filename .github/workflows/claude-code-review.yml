name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to publish inline review comments.
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Clear reserved review tooling path
        run: rm -rf .secure-review-tooling
      - name: Checkout immutable trusted review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: 754266328766453337830533266339f30a368749
          path: .secure-review-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/secure-review
            tools/harden-review-action.mjs
            tools/main-module.mjs
      - name: Prepare pinned claude dependencies
        uses: ./.secure-review-tooling/.github/actions/secure-review
        with:
          provider: claude
      - name: Run Claude Code Review
        id: claude-review
        uses: ./.secure-review-tooling/runtime/claude
        env:
          DISABLE_AUTOUPDATER: "1"
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} for actionable correctness and security regressions. Inspect the diff and relevant source. Report only verified issues with precise file and line references using inline comments."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
