name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # The pinned action's validator still exchanges an OIDC token.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Clear reserved review tooling path
        run: rm -rf .secure-review-tooling
      - name: Checkout immutable trusted review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: 754266328766453337830533266339f30a368749
          path: .secure-review-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/secure-review
            tools/harden-review-action.mjs
            tools/main-module.mjs
      - name: Prepare pinned droid dependencies
        uses: ./.secure-review-tooling/.github/actions/secure-review
        with:
          provider: droid
      - name: Run Droid Auto Review
        uses: ./.secure-review-tooling/runtime/droid
        with:
          github_token: ${{ github.token }}
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
