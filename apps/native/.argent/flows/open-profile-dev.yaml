steps:
  - echo: Restart Shelvr and expect Home.
  - launch: app.shelvr.save.dev
  - await: { visible: { text: Profile }, timeout: 120000 }
  - await: { idle: true }
  - echo: From Home, open Profile and expect account controls.
  - tap:
      id: person
  - await: { visible: { text: Contact Support } }
  - await: { idle: true }
