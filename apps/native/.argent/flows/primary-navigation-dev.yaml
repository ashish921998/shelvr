steps:
  - echo: Restart the Shelvr development build and expect Home.
  - launch: app.shelvr.save.dev
  - await: { visible: { text: Profile }, timeout: 120000 }
  - await: { idle: true }
  - echo: From Home, open Spaces and expect the new-space action.
  - tap: { id: rectangle.stack }
  - await: { visible: { text: New space } }
  - await: { idle: true }
  - echo: From Spaces, open Search and expect the empty search screen.
  - tap: { id: magnifyingglass }
  - await: { visible: { text: Find anything } }
  - await: { idle: true }
