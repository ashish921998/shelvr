steps:
  - echo: Restart the dev build; land on whatever first screen this install state
      shows.
  - launch: app.shelvr.save.dev
  # Let a cold process and first bundle load settle before the guards evaluate;
  # idle never fails, it only bounds the wait.
  - await: { idle: true, timeout: 60000 }
  - echo: If the sign-in screen is showing, use the passwordless dev login.
  - when: { visible: { id: dev-login-button } }
    steps:
      - tap: { id: dev-login-button }
      - await: { visible: { text: Home }, timeout: 60000 }
  - echo: Whether we just signed in or already were, end on Home.
  - await: { visible: { text: Home }, timeout: 90000 }
  - await: { idle: true }
