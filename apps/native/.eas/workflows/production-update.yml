name: Production OTA with native build configuration

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform with a released build matching this native configuration
        options: [all, android, ios]
        default: all
        required: true

jobs:
  publish:
    type: update
    environment: production
    env:
      APP_VARIANT: production
    params:
      channel: production
      platform: ${{ inputs.platform }}
    hooks:
      before_update:
        - name: Check production backend configuration
          run: |
            test -n "$EXPO_PUBLIC_CONVEX_URL" && test -n "$EXPO_PUBLIC_CONVEX_SITE_URL" || {
              echo "Production OTA requires EXPO_PUBLIC_CONVEX_URL and EXPO_PUBLIC_CONVEX_SITE_URL."
              exit 1
            }
        - name: Check Android Firebase file is available for fingerprinting
          if: ${{ inputs.platform != 'ios' }}
          run: |
            test -n "$GOOGLE_SERVICES_JSON" && test -f "$GOOGLE_SERVICES_JSON" || {
              echo "Android OTA requires the same GOOGLE_SERVICES_JSON file as the native build."
              exit 1
            }
