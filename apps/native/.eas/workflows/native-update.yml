name: Native OTA with matching build configuration

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Build profile of the installed binary
        options:
          [
            production,
            internal-test,
            preview,
            development,
            development-simulator,
          ]
        default: preview
        required: true
      platform:
        type: choice
        description: Platform with a released build matching this native configuration
        options: [all, android, ios]
        default: all
        required: true

jobs:
  publish:
    type: update
    environment: ${{ inputs.profile == 'preview' && 'preview' || (inputs.profile == 'development' || inputs.profile == 'development-simulator') && 'development' || 'production' }}
    env:
      APP_VARIANT: ${{ inputs.profile == 'preview' && 'preview' || (inputs.profile == 'development' || inputs.profile == 'development-simulator') && 'development' || 'production' }}
      ANDROID_BUILD_ARCHS: ${{ inputs.profile == 'development-simulator' && 'x86_64' || inputs.profile == 'development' && 'arm64-v8a' || '' }}
    params:
      channel: ${{ inputs.profile == 'development-simulator' && 'development' || inputs.profile }}
      platform: ${{ inputs.platform }}
    hooks:
      before_update:
        - name: Check backend configuration
          run: |
            test -n "$EXPO_PUBLIC_CONVEX_URL" && test -n "$EXPO_PUBLIC_CONVEX_SITE_URL" || {
              echo "OTA requires EXPO_PUBLIC_CONVEX_URL and EXPO_PUBLIC_CONVEX_SITE_URL."
              exit 1
            }
        - name: Check Android Firebase file is available for fingerprinting
          if: ${{ inputs.platform != 'ios' }}
          run: |
            test -n "$GOOGLE_SERVICES_JSON" && test -f "$GOOGLE_SERVICES_JSON" || {
              echo "Android OTA requires the same GOOGLE_SERVICES_JSON file as the native build."
              exit 1
            }
