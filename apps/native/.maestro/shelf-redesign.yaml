# The shelf redesign, end to end.
#
# What this is for: the redesign moved every root screen onto drawn shelves and
# replaced the tab bar with the floating paper pill. None of that is covered by
# the unit suite — the ink is a Skia canvas, and the component tests mock it
# away — so this flow is the only thing that proves the screens mount, the nav
# switches, and the shelves actually hold the saves.
#
# It asserts structure and seeded data, never the drawing: ink is
# `accessibilityElementsHidden`, so Maestro cannot see it by design. The
# screenshots are the record of how it looked; a human still has to look.
#
# Run against a development build (see .maestro/README.md).
appId: app.shelvr.save.dev
tags:
  - redesign
---
- launchApp
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/seed-fixtures.yaml

# ── Home ────────────────────────────────────────────────────────────────────
# Shelves grouped by recency under one counted headline, each save standing on
# a drawn board.
- assertVisible:
    text: "shelvr"
- assertVisible: "things waiting."
- assertVisible:
    id: "shelf-new"
- assertVisible:
    id: "fixture-item-ramen"
- takeScreenshot: redesign/01-home

# ── Nav E ───────────────────────────────────────────────────────────────────
# Five equal tabs. Each tap runs the ~900ms hand-redraw; what is asserted here
# is that it arrives, not how it looked getting there.
- tapOn:
    id: "tab-spaces"
- assertVisible: "spaces"
- assertVisible:
    id: "fixture-space-recipes"
- assertVisible: "Recipes"
- takeScreenshot: redesign/02-shelves

# ── A shelf page ────────────────────────────────────────────────────────────
# Name centred in the header with one summary line, an ellipsis and no plus,
# then the saves on the shelf.
- tapOn:
    id: "fixture-space-recipes"
- assertVisible:
    id: "fixture-space-detail-recipes"
    timeout: 20000
- assertVisible: "On the shelf"
- assertVisible:
    id: "shelf-items"
- takeScreenshot: redesign/03-shelf-page
- tapOn: "Back"

# ── Search ──────────────────────────────────────────────────────────────────
# The field is on the screen now; the nav no longer owns one.
- tapOn:
    id: "tab-search"
- assertVisible:
    id: "search-field"
- tapOn:
    id: "search-field"
- inputText: "Ramen"
- assertVisible:
    text: "Weeknight Miso Ramen"
    timeout: 20000
- takeScreenshot: redesign/04-search
- hideKeyboard

# ── The remaining tabs ──────────────────────────────────────────────────────
# Tidy and Map are not redesigned, but they ride the new nav, so the flow walks
# them to prove the pill routes to all five.
- tapOn:
    id: "tab-tidy"
- takeScreenshot: redesign/05-tidy
- tapOn:
    id: "tab-map"
- takeScreenshot: redesign/06-map

# ── Settings ────────────────────────────────────────────────────────────────
# Every control regrouped under eyebrows, appearance as one segmented pill.
- tapOn:
    id: "tab-home"
- tapOn: "Profile"
- assertVisible: "Appearance"
- assertVisible: "Sign out"
- takeScreenshot: redesign/07-settings
- tapOn: "Close profile"

# ── An item page ────────────────────────────────────────────────────────────
# The save lies on the table; no shelf is drawn under a single card.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "fixture-item-ramen"
- assertVisible:
    id: "fixture-item-detail-ramen"
    timeout: 20000
- takeScreenshot: redesign/08-item-page
- tapOn: "Back"
- assertVisible:
    id: "shelf-new"
