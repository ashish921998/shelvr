# install-qa completed 2026-09-17. Kept as the record of questionnaire answers.
# A future /install-qa run re-asks everything; these answers serve as defaults.
project: Shelvr
platform: github
imagemagick: true
completed: 2026-09-17

answers:
  scope: "Convex backend + Expo React Native mobile app E2E; web marketing site excluded"
  default_target: production # backend read-only; mobile always development
  backend_auth: "unauthenticated HTTP surface only"
  mobile_build: "local prebuild via `pnpm --filter native-app ios` (uses ios/ project)"
  mobile_persona: "anonymous dev login (AUTH_ENABLE_ANONYMOUS=true verified on dev deployment)"
  cleanup: "mobile: resetCurrentUser fixture reset (seed + cleanup); waitlist: qa+ emails left in dev"
  test_emails: "qa+<RUN_ID>@example.com pattern"
  ci: "backend-only QA on ubuntu; mobile E2E local-only"
  ci_gating: "optional / informational (does not block merge)"
  video_evidence: true # local simulator recordings only; CI is backend-only so nothing uploads
  droid_control_compose: false # no droid-control browser/terminal captures in scope
  failure_learning: suggest_in_report
  flows_confirmed: true

generated:
  - .factory/skills/qa/config.yaml
  - .factory/skills/qa/SKILL.md
  - .factory/skills/qa/REPORT-TEMPLATE.md
  - .factory/skills/qa-backend/SKILL.md
  - .factory/skills/qa-native/SKILL.md
  - .github/workflows/qa.yml
  - .github/workflows/qa-mobile.yml
  - .maestro/ (README + 4 flows)
  - tools/qa-backend.sh

notes:
  - "No droid-control plugin dependency: no QA flow uses a droid-control route
    (backend is curl, mobile uses the argent simulator session tools, web is
    out of scope). Add the plugin if browser-driven web QA enters scope."
  - "Sustainability architecture (survives without a Factory subscription):
    tools/qa-backend.sh is the deterministic backend baseline that always
    runs in CI; the droid exec agent layer is optional and auto-skips when
    FACTORY_API_KEY is absent; .maestro/ + qa-mobile.yml cover mobile E2E on
    a macOS runner nightly and on dispatch, no subscription needed."
  - "CI secrets: FACTORY_API_KEY (optional after the baseline change —
    enables the agent layer only); QA_WAITLIST_SHARED_SECRET (optional —
    unlocks dev positive waitlist flows); EXPO_TOKEN (qa-mobile.yml only —
    EAS build download)."
  - "qa-mobile prerequisites: a finished development-simulator EAS build must
    exist, and the EAS development environment must set
    EXPO_PUBLIC_AUTH_ENABLE_ANONYMOUS; Maestro flows were authored from the
    locale catalog and need selector iteration on the first CI run."
